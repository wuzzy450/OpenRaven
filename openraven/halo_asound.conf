# ALSA config for the sandbox (installed as ~/.asoundrc by play_halo.sh).
# The game opens "plug:surround51" / "plug:surround40" (the cabinet's USB 5.1 card).
# Folds surround channels into stereo with clean balanced gains to prevent clipping.
# ALSA channel order: 0 FL, 1 FR, 2 RL, 3 RR, 4 FC, 5 LFE.
# Every stream is mixed down to 16-bit stereo here, before the sound server: 6-channel float
# streams jammed PipeWire (and JamesDSP) on some PCs, leaving the whole PC silent until a restart.
pcm.!default {
    type plug
    slave {
        pcm { type pipewire }
        channels 2
        format S16_LE
        rate 48000
    }
    ttable.0.0 1.0
    ttable.1.1 1.0
    ttable.2.0 0.7
    ttable.3.1 0.7
    ttable.4.0 0.7
    ttable.4.1 0.7
    ttable.5.0 0.5
    ttable.5.1 0.5
}
ctl.!default { type pipewire }

pcm.halo_stereo {
    type plug
    slave { pcm { type pipewire } channels 2 }
}

pcm.!surround51 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 1.0
    ttable.1.1 1.0
    ttable.2.0 0.7
    ttable.3.1 0.7
    ttable.4.0 0.7
    ttable.4.1 0.7
    ttable.5.0 0.5
    ttable.5.1 0.5
}

pcm.!surround40 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 1.0
    ttable.1.1 1.0
    ttable.2.0 0.7
    ttable.3.1 0.7
}
