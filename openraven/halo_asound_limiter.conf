# OpenRaven ALSA Downmixing Configuration with Lookahead Soft-Limiter (WSLg / PulseAudio)
# Downmixes 5.1 / 4.0 surround to stereo with ITU-R BS.775 balanced weights,
# attenuates excessive arcade cabinet subwoofer (LFE) rumble for clean desktop audio,
# and transparently soft-limits peaks at -1.0 dBFS with 0 dB artificial boost to eliminate distortion.

pcm.!default {
    type plug
    slave.pcm "halo_limiter"
}
ctl.!default { type pulse }

pcm.halo_pulse {
    type plug
    slave.pcm {
        type pulse
    }
}

pcm.halo_limiter {
    type ladspa
    slave.pcm "halo_pulse"
    path "/usr/lib/ladspa"
    plugins [{
        label fastLookaheadLimiter
        id 1913
        input {
            # [ Input gain (dB), Limit (dB), Release time (s) ]
            # 0 dB input gain avoids over-driving the limiter (game master is already at 100%)
            # -1.0 dBFS limit guarantees zero digital clipping or speaker blowout
            # 0.15s release time preserves transient punch without pumping or muddiness
            controls [ 0 -1.0 0.15 ]
        }
    }]
}

pcm.halo_plug {
    type plug
    slave.pcm "halo_limiter"
}

pcm.!surround51 {
    type route
    slave.pcm "halo_plug"
    ttable.0.0 0.707
    ttable.1.1 0.707
    ttable.2.0 0.5
    ttable.3.1 0.5
    ttable.4.0 0.707
    ttable.4.1 0.707
    ttable.5.0 0.15
    ttable.5.1 0.15
}

pcm.!surround40 {
    type route
    slave.pcm "halo_plug"
    ttable.0.0 0.707
    ttable.1.1 0.707
    ttable.2.0 0.5
    ttable.3.1 0.5
}
