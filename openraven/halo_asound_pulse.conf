# Fallback ALSA config when PipeWire's ALSA plugin or LADSPA limiter isn't active.
# Downmixes 5.1/4.0 surround into stereo with clean balanced gains and attenuated LFE sub-bass.
# Every stream is mixed down to 16-bit stereo here, before the sound server: 6-channel float
# streams jammed PipeWire (and JamesDSP) on some PCs, leaving the whole PC silent until a restart.
pcm.!default {
    type plug
    slave { pcm "halo_pulse16" channels 2 }
    ttable.0.0 0.707
    ttable.1.1 0.707
    ttable.2.0 0.5
    ttable.3.1 0.5
    ttable.4.0 0.707
    ttable.4.1 0.707
    ttable.5.0 0.15
    ttable.5.1 0.15
}
ctl.!default { type pulse }

pcm.halo_pulse16 {
    type plug
    slave {
        pcm { type pulse }
        channels 2
        format S16_LE
        rate 48000
    }
}

pcm.halo_stereo {
    type plug
    slave { pcm { type pulse } channels 2 }
}

pcm.!surround51 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 0.707
    ttable.1.1 0.707
    ttable.2.0 0.5
    ttable.3.1 0.5
    ttable.4.0 0.707
    ttable.4.1 0.707
    ttable.5.0 0.15
    ttable.5.1 0.15
}

pcm.!surround40 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 0.707
    ttable.1.1 0.707
    ttable.2.0 0.5
    ttable.3.1 0.5
}
