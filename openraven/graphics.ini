# OpenRaven graphics settings. Delete this file to get the game's arcade defaults.
# UPPER-CASE keys are engine settings (applied by ravengfx.so); lower-case keys are launcher options.
# Tuned 2026-11-05 for max visual fidelity on a 4K screen + RTX 3080 (holds 60 FPS in gameplay).
# Screen resolution: WxH or "native" (your desktop size). ./play_halo.sh WxH overrides it.
resolution = native

# These are plain OpenGL engine settings: nothing here is NVIDIA- or Linux-desktop-specific.

# Upscaling + AA: FSR 2 Quality (renders at 67%, temporal reconstruction to 4K; 60 FPS at 4K).
# It sets the render size and the engine's TAA itself, and turns SMAA/FXAA off.
# Previous look: RENDER_SCALE = 1.25 + ENABLE_SMAA = 1 (graphics.ini.pre_s82).
UPSCALER = fsr2
FSR_QUALITY = performance
FSR_SHARPNESS = 0.5

# Frame generation: adaptive. Adds generated frames only when the game falls below the screen's
# refresh rate (read from the display), so it never lowers the real frame rate. On a 120 Hz+
# screen 2x doubles 60 FPS. REFRESH_RATE = auto (or a number if auto is wrong).
FRAME_GEN = 2x
FG_MODE = interpolate

# Texture filtering (game default 8)
ANISOTROPY_LEVEL = 16

# Shadows (defaults 2048 / 2048 / 2 splits / unstable)
SHADOW_SIZE = 4096
STATIC_SHADOW_SIZE = 4096
SHADOW_SPLITS = 4
ENABLE_STABLE_SHADOW = 1

# Screen-space reflections at full resolution (default 0.5)
SSR_BUFFER_SCALE = 1.0

# Post effects
ENABLE_SSAO = 1
# Enhanced bloom is broken in the engine: attract/menu scenes go white at any resolution (session 82).
ENHANCED_BLOOM = 0

# Added by the in-game overlay (F1)
RENDER_SCALE = 1.0000
ENABLE_TAA = 1

# Added by the in-game overlay (F1)
ENABLE_LENS_FLARE = 1

# Added by the in-game overlay (F1)
FPS_CAP = 0

# Added by the in-game overlay (F1)
VSYNC = 1

# Added by the in-game overlay (F1)
stick_speed = 0.5

# Added by the in-game overlay (F1)
NEURAL = 1
NEURAL_BACKEND = matrix
