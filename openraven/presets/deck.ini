# Steam Deck / handhelds: 1280x800 panel at full resolution, upscaler off (Derp0: 51-60 fps off vs
# 45-60 on), 60 fps cap so the CPU and battery get rest, engine TAA for anti-aliasing.
resolution = native
UPSCALER = off
RENDER_SCALE = 1.0
ENABLE_TAA = 1
ANISOTROPY_LEVEL = 8
SHADOW_SIZE = 2048
STATIC_SHADOW_SIZE = 2048
SHADOW_SPLITS = 2
ENABLE_STABLE_SHADOW = 1
SSR_BUFFER_SCALE = 0.5
ENABLE_SSAO = 1
ENABLE_LENS_FLARE = 0
VSYNC = 1
FPS_CAP = 60
